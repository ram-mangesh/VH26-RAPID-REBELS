apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: datastream
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    name: plaintext
  - port: 9094
    targetPort: 9094
    name: external
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: datastream
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  ports:
  - port: 8123
    targetPort: 8123
    name: http
  - port: 9000
    targetPort: 9000
    name: native
  selector:
    app: clickhouse
---
