apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-pipeline
  namespace: datastream
  labels:
    app: intelligence-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligence-pipeline
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: intelligence-pipeline
    spec:
      containers:
      - name: intelligence-pipeline
        image: datastream-main-intelligence-pipeline:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: KAFKA_BROKERS
          value: kafka:9092
        - name: KAFKA_TOPIC_EVENTS
          value: events
        - name: KAFKA_CONSUMER_GROUP
          value: intelligence-pipeline
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/state
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /api/state
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: datastream
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: datastream-main-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
